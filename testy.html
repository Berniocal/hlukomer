<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Test výpočtů · Hlukoměr</title>
<style>
:root{--bg:#09101c;--card:#101927;--card2:#0c1421;--line:#223149;--text:#eef4fb;--muted:#8ea0b7;--accent:#38bdf8;--ok:#34d399;--danger:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{width:min(100%,760px);margin:auto;padding-bottom:28px}.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}.top a,.top button{border:1px solid var(--line);background:#152236;color:var(--text);border-radius:12px;min-height:42px;padding:9px 12px;text-decoration:none;font:inherit;font-weight:750}.top h1{font-size:18px;margin:0;flex:1}.intro{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 12px}.summary{display:grid;gap:4px;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card)}.summary strong{font-size:19px}.summary span{font-size:12px;color:var(--muted)}.summary.good{border-color:#245f49;background:#123329}.summary.bad{border-color:#743645;background:#3a2029}.tests{display:grid;gap:8px}.test{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.test.good{border-left:4px solid var(--ok)}.test.bad{border-left:4px solid var(--danger)}.testHead{display:flex;align-items:center;gap:8px}.testHead strong{font-size:13px}.icon{font-weight:900}.values{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:11px}.values b{color:var(--text)}.note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:6px}.actions{display:grid;margin-top:12px}.actions button{border:1px solid #1f7aa4;background:#123d58;color:var(--text);border-radius:12px;min-height:48px;padding:10px;font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="top"><a href="index.html">← Hlukoměr</a><h1>Syntetický test výpočtů</h1></div>
  <p class="intro">Test nepoužívá mikrofon. Vkládá do stejného výpočtového jádra jako Hlukoměr přesně známé hodnoty a kontroluje Leq, A/C/Z vážení, oktávy, frekvenční korekce a SNR.</p>
  <div id="summary" class="summary"></div>
  <div id="testList" class="tests"></div>
  <div class="actions"><button id="runTests">Spustit test znovu</button></div>
</main>
<script src="acoustic-math.js?v=23"></script>
<script src="synthetic-tests.js?v=23"></script>
</body>
</html>
